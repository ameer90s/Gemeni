<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scalp Pro - v6.0 Original Strategy</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 15px;
            direction: rtl;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
            padding: 12px 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .status-badge {
            background: #ef4444;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }
        .status-badge.active { background: #22c55e; }
        .card {
            background: #1e293b;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border-radius: 8px;
            border: none;
            font-size: 15px;
            box-sizing: border-box;
        }
        input {
            background: #0f172a;
            color: white;
            border: 1px solid #334155;
        }
        button {
            background: #3b82f6;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background: #2563eb; }
        .stocks-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .stock-box {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
        }
        .stock-symbol { font-size: 18px; font-weight: bold; color: #38bdf8; }
        .stock-price { font-size: 16px; margin: 6px 0; color: #e2e8f0; }
        .stock-status { font-size: 11px; color: #94a3b8; background: #1e293b; padding: 3px 6px; border-radius: 6px; display: inline-block; }
        
        .signals-container { display: flex; flex-direction: column; gap: 10px; }
        .signal-card {
            background: linear-gradient(135deg, #065f46 0%, #064e3b 100%);
            border: 1px solid #10b981;
            border-radius: 10px;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .signal-card.empty {
            background: #0f172a;
            border: 1px dashed #334155;
            color: #64748b;
            justify-content: center;
            text-align: center;
        }
        .signal-info h4 { margin: 0 0 5px 0; color: #34d399; font-size: 16px; }
        .signal-info p { margin: 0; font-size: 13px; color: #cbd5e1; }
        .signal-badge { background: #10b981; color: white; padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; }

        .logs {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px;
            height: 120px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 11px;
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2 style="margin:0; font-size: 18px;">Scalp Pro <span style="font-size:12px; color:#38bdf8;">v6.0 Strategy</span></h2>
        <div id="statusBadge" class="status-badge">المراقبة: متوقفة</div>
    </div>

    <div class="card">
        <label style="font-size: 13px; font-weight: bold;">مفتاح Finnhub API Key</label>
        <input type="text" id="apiKeyInput" placeholder="أدخل المفتاح هنا...">
        <button onclick="saveApiKey()" style="background: #10b981; margin-top: 8px;">حفظ المفتاح</button>
    </div>

    <!-- كروت التوصيات المنفصلة -->
    <div class="card">
        <label style="font-size: 14px; font-weight: bold; margin-bottom: 10px; display: block; color: #38bdf8;">🎯 كروت التوصيات (EMA 9/21 + قاعدة < 2.5% + اختراق)</label>
        <div id="signalsCardArea" class="signals-container">
            <div class="signal-card empty">بانتظار تكون الشروط الفنية الأصلية على فريم 15m...</div>
        </div>
    </div>

    <div class="card">
        <label style="font-size: 14px; font-weight: bold; margin-bottom: 10px; display: block;">قائمة الأسهم الحية (15m)</label>
        <div class="stocks-grid">
            <div class="stock-box">
                <div class="stock-symbol">OKLO</div>
                <div id="price_OKLO" class="stock-price">$ --</div>
                <div class="stock-status" id="status_OKLO">جاهز</div>
            </div>
            <div class="stock-box">
                <div class="stock-symbol">TSLA</div>
                <div id="price_TSLA" class="stock-price">$ --</div>
                <div class="stock-status" id="status_TSLA">جاهز</div>
            </div>
            <div class="stock-box">
                <div class="stock-symbol">NVDA</div>
                <div id="price_NVDA" class="stock-price">$ --</div>
                <div class="stock-status" id="status_NVDA">جاهز</div>
            </div>
            <div class="stock-box">
                <div class="stock-symbol">SMCI</div>
                <div id="price_SMCI" class="stock-price">$ --</div>
                <div class="stock-status" id="status_SMCI">جاهز</div>
            </div>
            <div class="stock-box" style="grid-column: span 2;">
                <div class="stock-symbol">RGTI</div>
                <div id="price_RGTI" class="stock-price">$ --</div>
                <div class="stock-status" id="status_RGTI">جاهز</div>
            </div>
        </div>
        <button onclick="toggleMonitoring()" id="toggleBtn" style="margin-top: 15px;">تشغيل المراقبة والاستراتيجية الأصلية</button>
    </div>

    <div class="card">
        <label style="font-size: 13px; font-weight: bold; margin-bottom: 5px; display: block;">سجل النظام</label>
        <div id="logsContainer" class="logs">النظام بانتظار التشغيل...</div>
    </div>

    <script>
        const symbols = ['OKLO', 'TSLA', 'NVDA', 'SMCI', 'RGTI'];
        let isRunning = false;
        let monitoringTimer = null;
        let activeSignals = {};

        window.onload = function() {
            const savedKey = localStorage.getItem('finnhub_api_key');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
                logMessage("تم استرجاع مفتاح الـ API المحفوظ.");
            }
        };

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) {
                localStorage.setItem('finnhub_api_key', key);
                alert('تم حفظ المفتاح بنجاح!');
                logMessage("تم حفظ مفتاح Finnhub API.");
            }
        }

        function logMessage(msg) {
            const container = document.getElementById('logsContainer');
            const time = new Date().toLocaleTimeString();
            container.innerHTML += `<br>[${time}] ${msg}`;
            container.scrollTop = container.scrollHeight;
        }

        function toggleMonitoring() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (!key) {
                alert('الرجاء إدخال وحفظ مفتاح الـ API أولاً!');
                return;
            }

            isRunning = !isRunning;
            const badge = document.getElementById('statusBadge');
            const btn = document.getElementById('toggleBtn');

            if (isRunning) {
                badge.classList.add('active');
                badge.innerText = 'المراقبة: تعمل';
                btn.innerText = 'إيقاف المراقبة';
                btn.style.background = '#ef4444';
                logMessage("بدء فحص الشموع واستراتيجية 15 دقيقة...");
                runStrategyLoop();
            } else {
                badge.classList.remove('active');
                badge.innerText = 'المراقبة: متوقفة';
                btn.innerText = 'تشغيل المراقبة والاستراتيجية الأصلية';
                btn.style.background = '#3b82f6';
                clearTimeout(monitoringTimer);
                logMessage("تم إيقاف المراقبة.");
            }
        }

        async classFetch(url) {
            const proxies = [
                `https://corsproxy.io/?${encodeURIComponent(url)}`,
                `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`
            ];
            for (let p of proxies) {
                try {
                    let res = await fetch(p);
                    if (res.ok) return await res.json();
                } catch(e) {}
            }
            return null;
        }

        // حساب المتوسط الاسي EMA
        function calculateEMA(data, period) {
            let k = 2 / (period + 1);
            let emaArray = [data[0]];
            for (let i = 1; i < data.length; i++) {
                emaArray.push((data[i] * k) + (emaArray[i - 1] * (1 - k)));
            }
            return emaArray;
        }

        async function runStrategyLoop() {
            if (!isRunning) return;
            const key = document.getElementById('apiKeyInput').value.trim();
            if (!key) return;

            const now = Math.floor(Date.now() / 1000);
            const fromTime = now - (86400); // بيانات يوم كامل لفريم 15د

            for (let symbol of symbols) {
                if (!isRunning) break;

                document.getElementById(`status_${symbol}`).innerText = `فحص 15m...`;

                // 1. جلب الأسعار اللحظية لعرضها في المربعات
                const quoteUrl = `https://finnhub.io/api/v1/quote?symbol=${symbol}&token=${key}`;
                const quoteData = await classFetch(quoteUrl);

                if (quoteData && quoteData.c !== undefined && quoteData.c !== 0) {
                    let price = quoteData.c;
                    let prevClose = quoteData.pc;
                    let change = prevClose ? ((price - prevClose) / prevClose * 100).toFixed(2) : '0.00';

                    document.getElementById(`price_${symbol}`).innerText = `$${price.toFixed(2)}`;
                    let statusElem = document.getElementById(`status_${symbol}`);
                    statusElem.innerText = `تغير: ${change >= 0 ? '+' : ''}${change}%`;
                    statusElem.style.color = change >= 0 ? '#22c55e' : '#ef4444';
                }

                // 2. جلب شموع فريم 15 دقيقة لتطبيق شروط الاستراتيجية الأصلية بدقة
                const candleUrl = `https://finnhub.io/api/v1/stock/candle?symbol=${symbol}&resolution=15&from=${fromTime}&to=${now}&token=${key}`;
                const candleData = await classFetch(candleUrl);

                if (candleData && candleData.s === 'ok' && candleData.c && candleData.c.length > 25) {
                    let closes = candleData.c;
                    let highs = candleData.h;
                    let lows = candleData.l;

                    let ema9 = calculateEMA(closes, 9);
                    let ema21 = calculateEMA(closes, 21);

                    let lastIdx = closes.length - 1;
                    let currentEMA9 = ema9[lastIdx];
                    let currentEMA21 = ema21[lastIdx];
                    let prevEMA9 = ema9[lastIdx - 1];
                    let prevEMA21 = ema21[lastIdx - 1];

                    // الشرط الأول: تقاطع EMA 9 فوق EMA 21
                    let isCrossover = (prevEMA9 <= prevEMA21 && currentEMA9 > currentEMA21);

                    // الشرط الثاني: قاعدة ضيقة (تذبذب آخر الشموع أقل من 2.5%)
                    let recentHighs = highs.slice(lastIdx - 5, lastIdx);
                    let recentLows = lows.slice(lastIdx - 5, lastIdx);
                    let maxH = Math.max(...recentHighs);
                    let minL = Math.min(...recentLows);
                    let baseVolatility = ((maxH - minL) / minL) * 100;
                    let isTightBase = baseVolatility < 2.5;

                    // الشرط الثالث: تأكيد الاختراق (إغلاق أعلى مقاومة القاعدة)
                    let isBreakout = closes[lastIdx] > maxH;

                    if (isCrossover && isTightBase && isBreakout) {
                        activeSignals[symbol] = {
                            price: closes[lastIdx],
                            volatility: baseVolatility.toFixed(2),
                            time: new Date().toLocaleTimeString()
                        };
                        renderSignals();
                        logMessage(`🔥 تحققت شروط الاستراتيجية الأصلية على ${symbol} بنجاح!`);
                    }
                }

                await new Promise(r => setTimeout(r, 4000)); // فاصل زمني آمن بين كل سهم
            }

            if (isRunning) {
                monitoringTimer = setTimeout(runStrategyLoop, 30000);
            }
        }

        function renderSignals() {
            let container = document.getElementById('signalsCardArea');
            let keys = Object.keys(activeSignals);

            if (keys.length === 0) {
                container.innerHTML = `<div class="signal-card empty">بانتظار تكون الشروط الفنية الأصلية على فريم 15m...</div>`;
                return;
            }

            container.innerHTML = '';
            keys.forEach(sym => {
                let sig = activeSignals[sym];
                container.innerHTML += `
                    <div class="signal-card">
                        <div class="signal-info">
                            <h4>🎯 توصية رسمية مطابقة: ${sym}</h4>
                            <p>السعر: <b>$${sig.price}</b> | تذبذب القاعدة: ${sig.volatility}%</p>
                            <p style="font-size: 11px; color: #cbd5e1; margin-top: 2px;">الشروط: تقاطع EMA 9/21 + قاعدة ضيقة + اختراق مؤكد (15m)</p>
                        </div>
                        <div class="signal-badge">دخول آمن</div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
